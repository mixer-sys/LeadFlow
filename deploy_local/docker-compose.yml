services:
  nginx:
    image: nginx:alpine
    container_name: leadflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/leadflow.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - app

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    image: leadflow-api:${IMAGE_TAG:-local}
    pull_policy: build
    container_name: leadflow-api
    restart: unless-stopped
    command: ["/bin/leadflow-api"]
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-leadflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-leadflow}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      API_KEY: ${API_KEY:?API_KEY is required}
      GRPC_INTERNAL_TOKEN: ${GRPC_INTERNAL_TOKEN:?GRPC_INTERNAL_TOKEN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
    secrets:
      - db_password
      - api_key
      - grpc_internal_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles:
      - app

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    image: leadflow-worker:${IMAGE_TAG:-local}
    pull_policy: build
    container_name: leadflow-worker
    restart: unless-stopped
    command: ["/bin/leadflow-worker"]
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-leadflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-leadflow}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      GRPC_INTERNAL_TOKEN: ${GRPC_INTERNAL_TOKEN:?GRPC_INTERNAL_TOKEN is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
    secrets:
      - db_password
      - grpc_internal_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: leadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-leadflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - app

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-noeviction}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles:
      - app

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: leadflow-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    profiles:
      - observability

  loki:
    image: grafana/loki:3.5.0
    container_name: leadflow-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.6.0
    container_name: leadflow-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.5.0
    container_name: leadflow-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - observability

  migrate:
    image: kukymbr/goose-docker:3.27.2
    container_name: leadflow-migrate
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER:-leadflow} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-leadflow} sslmode=${DB_SSLMODE:-disable}"
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_COMMAND: up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app

  seed:
    image: postgres:17-alpine
    container_name: leadflow-seed
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./seed:/seed:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-leadflow}
      - -d
      - ${POSTGRES_DB:-leadflow}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    profiles:
      - app

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:

secrets:
  db_password:
    file: ./secrets/db_password
  api_key:
    file: ./secrets/api_key
  grpc_internal_token:
    file: ./secrets/grpc_internal_token