name: CI

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U leadflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://leadflow:leadflow@localhost:5432/leadflow?sslmode=disable
      REDIS_ADDR: localhost:6379
      API_KEY: test-api-key
      PORT: "8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "These files are not formatted:"
            gofmt -l .
            exit 1
          }

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -cover

      - name: Build
        run: go build -o leadflow ./cmd/api

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: leadflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max