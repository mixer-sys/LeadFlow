groups:
  - name: leadflow-webhooks
    rules:
      - alert: LeadflowWebhookHighErrorRate
        expr: |
          sum(rate(leadflow_webhook_deliveries_total{status="error"}[5m]))
          /
          sum(rate(leadflow_webhook_deliveries_total[5m]))
          > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High webhook error rate"
          description: "More than 20% of webhook deliveries are failing for 5 minutes."

      - alert: LeadflowWebhookDeadLetter
        expr: |
          increase(leadflow_webhook_dead_letters_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Webhook delivery moved to dead-letter"
          description: "At least one webhook delivery exhausted all retry attempts in the last 10 minutes."

      - alert: LeadflowWebhookCircuitBreakerOpen
        expr: |
          leadflow_webhook_circuit_breaker_open == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Webhook circuit breaker is open"
          description: "The webhook circuit breaker has been open for more than 2 minutes."

      - alert: LeadflowWebhookNoSuccess
        expr: |
          sum(rate(leadflow_webhook_deliveries_total{status="success"}[15m])) == 0
          and
          sum(rate(leadflow_webhook_deliveries_total[15m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful webhook deliveries"
          description: "Webhooks are being attempted, but none have succeeded for 15 minutes."