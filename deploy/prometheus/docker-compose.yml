services:
  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: leadflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.31.1
    container_name: leadflow-alertmanager
    ports:
      - "9093:9093"
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - /alertmanager-entrypoint.sh
    volumes:
      - ./alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager-entrypoint.sh:/alertmanager-entrypoint.sh:ro
  grafana:
    image: grafana/grafana:12.3.1
    container_name: leadflow-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-data: