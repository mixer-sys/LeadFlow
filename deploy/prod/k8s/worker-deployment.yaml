apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leadflow-worker
  template:
    metadata:
      labels:
        app: leadflow-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/mixer-sys/leadflow-worker:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: DB_HOST
              value: postgres
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
