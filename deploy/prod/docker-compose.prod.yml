services:
  nginx:
    image: nginx:alpine
    container_name: leadflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/leadflow.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - api

  api:
    image: ghcr.io/${GHCR_OWNER}/leadflow-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: leadflow-api
    restart: unless-stopped
    command: ["/bin/leadflow-api"]
    environment:
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: leadflow
      DB_NAME: leadflow
      DB_SSLMODE: require
      REDIS_ADDR: redis:6379
      LOG_LEVEL: info
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    secrets:
      - db_password
      - api_key
      - grpc_internal_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    image: ghcr.io/${GHCR_OWNER}/leadflow-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: leadflow-worker
    restart: unless-stopped
    command: ["/bin/leadflow-worker"]
    environment:
      REDIS_ADDR: redis:6379
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: leadflow
      DB_NAME: leadflow
      DB_SSLMODE: require
      LOG_LEVEL: info
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    secrets:
      - db_password
      - telegram_token
      - telegram_chat_id
      - bitrix24_url
      - grpc_internal_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: leadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: leadflow
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  certbot_www:

secrets:
  db_password:
    file: /opt/leadflow/secrets/db_password
  api_key:
    file: /opt/leadflow/secrets/api_key
  grpc_internal_token:
    file: /opt/leadflow/secrets/grpc_internal_token
  telegram_token:
    file: /opt/leadflow/secrets/telegram_token
  telegram_chat_id:
    file: /opt/leadflow/secrets/telegram_chat_id
  bitrix24_url:
    file: /opt/leadflow/secrets/bitrix24_url