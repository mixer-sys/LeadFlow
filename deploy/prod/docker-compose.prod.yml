services:
  nginx:
    image: nginx:alpine
    container_name: leadflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/leadflow.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    profiles:
      - app

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: leadflow-api:local
    pull_policy: build
    container_name: leadflow-api
    restart: unless-stopped
    command: ["/bin/leadflow-api"]
    environment:
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: leadflow
      DB_PASSWORD: leadflow
      DB_NAME: leadflow
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      LOG_LEVEL: info
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles:
      - app

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: leadflow-worker:local
    pull_policy: build
    container_name: leadflow-worker
    restart: unless-stopped
    command: ["/bin/leadflow-worker"]
    environment:
      REDIS_ADDR: redis:6379
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: leadflow
      DB_PASSWORD: leadflow
      DB_NAME: leadflow
      DB_SSLMODE: disable
      LOG_LEVEL: info
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      GRPC_INTERNAL_TOKEN: ${GRPC_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: leadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
      POSTGRES_DB: leadflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - app

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles:
      - app

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: leadflow-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

  loki:
    image: grafana/loki:3.5.0
    container_name: leadflow-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.6.0
    container_name: leadflow-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.5.0
    container_name: leadflow-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data: