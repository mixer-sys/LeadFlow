<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>LeadFlow — Webhooks</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .nav { margin-bottom: 16px; display: flex; gap: 16px; }
        .create { max-width: 520px; display: grid; gap: 8px; margin-bottom: 24px; }
        input { padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/admin/leads">Лиды</a>
        <a href="/admin/settings/telegram">Telegram</a>
        <a href="/admin/webhooks">Webhooks</a>
    </div>

   <h1>Telegram-каналы</h1>

<form method="post" action="/admin/telegram">
  <input type="text" name="name" placeholder="Название" required>
  <input type="text" name="bot_token" placeholder="Bot Token" required>
  <input type="text" name="chat_id" placeholder="Chat ID" required>
  <button type="submit">Добавить</button>
</form>

<table>
  <thead>
    <tr>
      <th>Название</th>
      <th>Chat ID</th>
      <th>Статус</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {{range .Channels}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{.ChatID}}</td>
      <td>
        {{if .IsActive}}Включён{{else}}Выключен{{end}}
      </td>
      <td>
        <form method="post" action="/admin/telegram/{{.ID}}/toggle">
          <button type="submit">
            {{if .IsActive}}Выключить{{else}}Включить{{end}}
          </button>
        </form>

        <form method="post" action="/admin/telegram/{{.ID}}/delete">
          <button type="submit">Удалить</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
</body>
</html>
