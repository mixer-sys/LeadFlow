<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>LeadFlow — Webhooks</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .nav { margin-bottom: 16px; display: flex; gap: 16px; }
        .create { max-width: 520px; display: grid; gap: 8px; margin-bottom: 24px; }
        input { padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/admin/leads">Лиды</a>
        <a href="/admin/settings/telegram">Telegram</a>
        <a href="/admin/webhooks">Webhooks</a>
    </div>

    <h1>Webhooks</h1>

    <form method="post" action="/admin/webhooks" class="create">
        <input
            type="url"
            name="url"
            placeholder="https://example.com/webhook"
            required
        >

        <input
            type="text"
            name="secret"
            placeholder="Secret"
        >

        <input
            type="text"
            name="events"
            value="lead.created"
        >

        <button type="submit">Добавить webhook</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>URL</th>
                <th>События</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>

        <tbody>
            {{ range .Items }}
            <tr>
                <td>{{ .ID }}</td>
                <td>{{ .URL }}</td>
                <td>{{ .Events }}</td>
                <td>
                    {{ if .IsActive }}
                        Включён
                    {{ else }}
                        Выключен
                    {{ end }}
                </td>
                <td>
                    <form
                        method="post"
                        action="/admin/webhooks/{{ .ID }}/toggle"
                        style="display:inline"
                    >
                        <button type="submit">
                            {{ if .IsActive }}Выключить{{ else }}Включить{{ end }}
                        </button>
                    </form>
                    
                    <form method="post"
                        action="/admin/webhooks/{{ .ID }}/test"
                        style="display:inline">
                        <input type="hidden" name="url" value="{{ .URL }}">

                        <button type="submit">Тест</button>
                    </form>

                    <form
                        method="post"
                        action="/admin/webhooks/{{ .ID }}/delete"
                        style="display:inline"
                    >
                        <button type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</body>
</html>
