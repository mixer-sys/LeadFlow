
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadflow-api
    ports:
      - "8080:8080"
    environment:
      - HTTP_ADDR=:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=leadflow
      - DB_PASSWORD=leadflow
      - DB_NAME=leadflow
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadflow-worker
    command: ["/bin/leadflow-worker"]
    environment:
      - HTTP_ADDR=:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=leadflow
      - DB_PASSWORD=leadflow
      - DB_NAME=leadflow
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - postgres
      - redis
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
      POSTGRES_DB: leadflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: leadflow-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data: